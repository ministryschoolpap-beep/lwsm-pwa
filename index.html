<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>LWSM</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a1469">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png?v=4">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LWSM">
<style>
  html,body{margin:0;height:100%;background:#4a1469;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;overflow:hidden}
  #app{position:fixed;left:0;right:0;top:var(--bar-h,0px);width:100%;height:calc(100% - var(--bar-h,0px));border:0;background:#fff;display:none;
       padding-top:var(--app-pad,env(safe-area-inset-top));box-sizing:border-box}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
          background:radial-gradient(circle at 50% 0%,#7b2cb0,#4a1469 60%,#2a0b3f)}
  .screen img{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .screen h1{margin:0;font-size:22px;font-weight:700} .screen p{margin:0;opacity:.85;font-size:14px;max-width:440px;line-height:1.45}
  button{padding:13px 22px;border:0;border-radius:12px;background:#fdf3c0;color:#4a1469;font-weight:700;font-size:15px;cursor:pointer}
  .ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.5)}
  #loading{z-index:3}
  /* bandeaux (hors-ligne / installation / mise à jour) */
  #bars{position:fixed;left:0;right:0;top:0;z-index:10;padding-top:env(safe-area-inset-top);background:#4a1469}
  .bar{display:none;align-items:center;justify-content:center;gap:12px;padding:8px 12px;font-size:13px;line-height:1.3;text-align:left}
  .bar span{flex:1;max-width:520px}
  .bar button{padding:8px 16px;border-radius:9px;font-size:13px;white-space:nowrap;flex:0 0 auto}
  #offline{background:#ef6c00;font-weight:700;justify-content:center;text-align:center}
  #installBar{background:#4a1469;border-bottom:2px solid #c9a227}
  #updateBar{background:#c9a227;color:#1c2438}
  #updateBar button{background:#fff;color:#14264f}
  #sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
  #sheet .card{background:#fff;color:#1c2438;width:min(100%,460px);border-radius:18px 18px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom));text-align:left}
  #sheet h2{margin:0 0 10px;font-size:18px} #sheet ol{margin:0 0 16px;padding-left:20px;line-height:1.7;font-size:14.5px}
  #sheet button{width:100%;background:#4a1469;color:#fff}
</style>
</head>
<body>
<div id="bars">
  <div id="offline" class="bar">📴 Hors ligne — reconnexion en cours…</div>
  <div id="updateBar" class="bar"><span>🔄 Une nouvelle version est disponible.</span><button id="updateBtn">Mettre à jour</button></div>
  <div id="installBar" class="bar"><span>📲 Installez <b>LWSM</b> sur cet appareil.</span><button id="installBtn">Installer</button></div>
</div>

<div id="sheet"><div class="card">
  <h2>Installer LWSM</h2>
  <ol id="sheetSteps"></ol>
  <button id="sheetClose">J'ai compris</button>
</div></div>

<div id="offlineScreen" class="screen" style="display:none">
  <img src="icons/icon-192.png?v=4" alt="">
  <h1>Vous êtes hors ligne</h1>
  <p>Le portail se rouvrira dès que la connexion sera rétablie.</p>
  <button id="retryConnection" class="ghost">Réessayer</button>
</div>

<div id="loading" class="screen" style="display:none">
  <img src="icons/icon-192.png?v=4" alt="">
  <h1>Chargement…</h1>
  <p id="slow" style="display:none">Le chargement est long. Vérifiez la connexion internet.</p>
</div>

<iframe id="app" title="LWSM"
  allow="camera *; microphone *; autoplay *; fullscreen *; clipboard-write *; geolocation *"
  allowfullscreen></iframe>

<script>
  const DEFAULT_APP_URL = "https://script.google.com/macros/s/AKfycbxUMi8xcYXSCGvTGD1T7EGqvKu4AxsOQY7s14xwxY3_E2H6cyDMd2XXJbV3fOZ_coJybw/exec?page=admin";
  const $ = id => document.getElementById(id);

  function start() {
    const f = $("app");
    $("offlineScreen").style.display = navigator.onLine || f.style.display === "block" ? "none" : "flex";
    if (!navigator.onLine) { $("loading").style.display = "none"; return; }
    $("loading").style.display = "flex";
    f.onload = () => {
      clearTimeout(slowT);
      $("loading").style.display = "none";
      f.style.display = "block";
    };
    $("slow").style.display = "none";
    const slowT = setTimeout(() => { $("slow").style.display = "block"; }, 12000);
    f.src = DEFAULT_APP_URL;
  }

  // ── Hauteur des bandeaux : l'application s'affiche en dessous ──
  function measureBars() {
    const h = $("bars").offsetHeight;
    const anyBar = ["offline", "updateBar", "installBar"].some(id => $(id).style.display === "flex");
    document.documentElement.style.setProperty("--bar-h", anyBar ? h + "px" : "0px");
    document.documentElement.style.setProperty("--app-pad", anyBar ? "0px" : "env(safe-area-inset-top)");
  }
  function showBar(id, on) { $(id).style.display = on ? "flex" : "none"; measureBars(); }
  if ("ResizeObserver" in window) new ResizeObserver(measureBars).observe($("bars"));

  // ── Hors-ligne ──
  function net() {
    showBar("offline", !navigator.onLine);
    if ($("app").style.display !== "block") start();
  }
  addEventListener("online", net);
  addEventListener("offline", net);
  $("retryConnection").onclick = start;
  showBar("offline", !navigator.onLine);

  // ── Installation : le bandeau reste tant que l'app n'est pas installée ──
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = /android/i.test(navigator.userAgent);
  let deferred = null;
  if (!standalone) {
    addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; showBar("installBar", true); });
    if (isIOS || isAndroid) showBar("installBar", true);
  }
  addEventListener("appinstalled", () => { deferred = null; showBar("installBar", false); });
  $("installBtn").onclick = async () => {
    if (deferred) {
      const ev = deferred; deferred = null;
      try { ev.prompt(); const r = await ev.userChoice; if (r && r.outcome === "accepted") { showBar("installBar", false); return; } } catch (e) {}
    }
    $("sheetSteps").innerHTML = isIOS
      ? "<li>Touchez le bouton <b>Partager</b> (carré avec une flèche) dans Safari.</li><li>Choisissez <b>Sur l'écran d'accueil</b>.</li><li>Touchez <b>Ajouter</b>.</li>"
      : isAndroid
      ? "<li>Ouvrez cette page dans Chrome à jour.</li><li>Dans le menu <b>⋮</b>, choisissez <b>Installer et créer un raccourci</b> ou <b>Ajouter à l’écran d’accueil</b>.</li><li>Choisissez <b>Installer</b>. Si l’installation est indisponible ou bloquée, choisissez <b>Créer un raccourci</b> si Chrome le propose.</li>"
      : "<li>Ouvrez le menu du navigateur (<b>⋮</b> ou l'icône d'installation dans la barre d'adresse).</li><li>Choisissez <b>Installer l'application</b>.</li><li>Confirmez avec <b>Installer</b>.</li>";
    $("sheet").style.display = "flex";
  };
  $("sheetClose").onclick = () => { $("sheet").style.display = "none"; };

  const LOADED_VERSION = "20261122-3";
  const worker = navigator.serviceWorker;
  const registration = worker ? worker.register("sw.js", { updateViaCache: "none" }).catch(() => null) : Promise.resolve(null);
  let checking = false;
  async function checkVersion() {
    if (checking || !navigator.onLine) return;
    checking = true;
    try {
      const response = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
      if (response.ok) {
        const { version } = await response.json();
        if (version) showBar("updateBar", String(version) !== LOADED_VERSION);
      }
    } catch (error) { /* A later check can retry. */ }
    finally { checking = false; }
  }
  let reloadRequested = false;
  if (worker) worker.addEventListener("controllerchange", () => {
    if (reloadRequested) location.replace(location.pathname + "?u=" + Date.now());
  });
  $("updateBtn").onclick = async () => {
    if (!navigator.onLine || reloadRequested) return;
    reloadRequested = true;
    $("updateBtn").disabled = true;
    const reg = await registration;
    if (reg) {
      try { await reg.update(); } catch (error) {}
      if (reg.waiting) reg.waiting.postMessage("SKIP_WAITING");
    }
    if (!reg || (!reg.installing && !reg.waiting)) location.replace(location.pathname + "?u=" + Date.now());
    else setTimeout(() => {
      reloadRequested = false;
      $("updateBtn").disabled = false;
      checkVersion();
    }, 10000);
  };
  checkVersion();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkVersion(); });
  addEventListener("online", checkVersion);
  setInterval(checkVersion, 5 * 60 * 1000);

  // ── Navigation demandée par la page Apps Script (ex. connexion admin) : on reste dans le cadre, en plein écran ──
  addEventListener("message", ev => {
    const d = ev.data;
    if (!d || d.type !== "lwsm-navigate" || typeof d.url !== "string") return;
    if (!/^https:\/\/([a-z0-9-]+\.)*(googleusercontent|google)\.com$/.test(ev.origin)) return;   // vient bien de Google
    if (!/^https:\/\/script\.google\.com\/.+\/exec(\?|$)/.test(d.url)) return;                          // adresse d'application Apps Script uniquement
    $("loading").style.display = "flex";
    $("app").src = d.url;
  });

  // ── Garde l'écran allumé (utile pour le kiosque) ──
  let wl = null;
  async function keepAwake() { try { if ("wakeLock" in navigator) wl = await navigator.wakeLock.request("screen"); } catch (e) {} }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
  keepAwake();
  start();
</script>
</body>
</html>
