<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Portail Etudiant LWSM</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14264f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png?v=4">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portail LWSM">
<style>
  html,body{margin:0;height:100%;background:#14264f;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;overflow:hidden}
  #app{position:fixed;left:0;right:0;top:var(--bar-h,0px);width:100%;height:calc(100% - var(--bar-h,0px));border:0;background:#fff;display:none;
       padding-top:var(--app-pad,env(safe-area-inset-top));box-sizing:border-box}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
          background:radial-gradient(circle at 50% 0%,#1f4e9c,#14264f 60%,#0b1530)}
  .screen img{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .screen h1{margin:0;font-size:22px;font-weight:700} .screen p{margin:0;opacity:.85;font-size:14px;max-width:440px;line-height:1.45}
  button{padding:13px 22px;border:0;border-radius:12px;background:#fdf3c0;color:#14264f;font-weight:700;font-size:15px;cursor:pointer}
  .ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.5)}
  #loading{z-index:3}
  #offlineScreen{z-index:4;overflow:auto;display:none;align-items:center;justify-content:normal;padding-top:72px}
  #offlineHomework{width:min(100%,520px);text-align:left;margin:0;padding:0;list-style:none}
  #offlineHomework fieldset{margin:12px 0;border:1px solid #ffffff55;border-radius:8px;min-width:0}
  #offlineHomework label{display:block;padding:8px 0}
  #offlineHomework li{padding:10px 12px;margin-bottom:8px;border-radius:8px;background:#ffffff19;overflow-wrap:anywhere}
  /* bandeaux (hors-ligne / installation / mise à jour) */
  #bars{position:fixed;left:0;right:0;top:0;z-index:10;padding-top:env(safe-area-inset-top);background:#14264f}
  .bar{display:none;align-items:center;justify-content:center;gap:12px;padding:8px 12px;font-size:13px;line-height:1.3;text-align:left}
  .bar span{flex:1;max-width:520px}
  .bar button{padding:8px 16px;border-radius:9px;font-size:13px;white-space:nowrap;flex:0 0 auto}
  #offline{background:#ef6c00;font-weight:700;justify-content:center;text-align:center}
  #installBar{background:#14264f;border-bottom:2px solid #c9a227}
  #updateBar{background:#c9a227;color:#1c2438}
  #updateBar button{background:#fff;color:#14264f}
  #sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
  #sheet .card{background:#fff;color:#1c2438;width:min(100%,460px);border-radius:18px 18px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom));text-align:left}
  #sheet h2{margin:0 0 10px;font-size:18px} #sheet ol{margin:0 0 16px;padding-left:20px;line-height:1.7;font-size:14.5px}
  #sheet button{width:100%;background:#14264f;color:#fff}
</style>
</head>
<body>
<div id="bars">
  <div id="offline" class="bar">📴 Hors ligne <button id="browseOffline" type="button">Devoirs hors ligne</button></div>
  <div id="updateBar" class="bar"><span>🔄 Une nouvelle version est disponible.</span><button id="updateBtn">Mettre à jour</button></div>
  <div id="installBar" class="bar"><span>📲 Installez <b>Portail Etudiant LWSM</b> sur cet appareil.</span><button id="installBtn">Installer</button></div>
</div>

<div id="sheet"><div class="card">
  <h2>Installer Portail Etudiant LWSM</h2>
  <ol id="sheetSteps"></ol>
  <button id="sheetClose">J'ai compris</button>
</div></div>

<div id="offlineScreen" class="screen" style="display:none">
  <img src="icons/icon-192.png?v=4" alt="">
  <h1>Vous êtes hors ligne</h1>
  <p id="offlineHomeworkNote">Les devoirs consultés en ligne apparaîtront ici.</p>
  <ul id="offlineHomework" aria-label="Devoirs enregistrés"></ul>
  <button id="retryConnection" class="ghost">Réessayer</button>
</div>

<div id="loading" class="screen" style="display:none">
  <img src="icons/icon-192.png?v=4" alt="">
  <h1>Chargement…</h1>
  <p id="slow" style="display:none">Le chargement est long. Vérifiez la connexion internet.</p>
</div>

<iframe id="app" title="Portail Etudiant LWSM"
  allow="camera *; microphone *; autoplay *; fullscreen *; clipboard-write *; geolocation *"
  allowfullscreen></iframe>

<script>
  const DEFAULT_APP_URL = "https://script.google.com/macros/s/AKfycbzQR5wqe6-uBbmbf9t0fD3Nx2761iWk6bjO4CDjNBHL5Vw28Z6TKPLYZvX0TKZbKe6B/exec";
  const $ = id => document.getElementById(id);



  const offlineKey = "lwsm-student-offline-homework";
  const taskKey = account => "lwsm-offline-tasks:" + account;
  let portalFrame = null;
  let syncing = null;

  function readLocal(key) {
    try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (error) { return null; }
  }

  function tasksFor(account) {
    const tasks = readLocal(taskKey(account));
    return Array.isArray(tasks) ? tasks : [];
  }

  function saveTasks(account, tasks) {
    try { localStorage.setItem(taskKey(account), JSON.stringify(tasks)); return true; }
    catch (error) { return false; }
  }

  function syncOfflineHomework() {
    if (!navigator.onLine || !portalFrame || syncing) return;
    const { account, source, origin } = portalFrame;
    const task = tasksFor(account).find(item => item.queued && !item.error);
    if (!task) return;
    const id = task.submissionId;
    const timer = setTimeout(() => { if (syncing && syncing.id === id) syncing = null; }, 30000);
    syncing = { id, account, timer };
    source.postMessage({ type: "lwsm-sync-homework", account, attempt: {
      title: task.title, version: task.version, answers: task.answers, submissionId: id
    } }, origin);
  }

  function textNode(tag, text) {
    const node = document.createElement(tag);
    node.textContent = text;
    return node;
  }

  function renderOfflineHomework() {
    const list = $("offlineHomework");
    list.replaceChildren();
    const snapshot = readLocal(offlineKey);
    if (!snapshot || !Array.isArray(snapshot.homework)) {
      $("offlineHomeworkNote").textContent = "Ouvrez un devoir en ligne une fois pour le rendre disponible hors ligne.";
      return;
    }
    $("offlineHomeworkNote").textContent = "Ouvrez un devoir déjà chargé. Vos réponses seront envoyées après reconnexion au même compte.";
    const tasks = tasksFor(snapshot.account);
    const shown = new Set();
    function add(title, dueDate, task) {
      const item = textNode("li", title + (dueDate ? " · Échéance : " + dueDate : ""));
      if (task) {
        shown.add(task.title);
        if (task.error) item.append(textNode("p", task.error));
        else if (task.queued) item.append(textNode("p", "Réponses en attente de synchronisation."));
        else if (task.sent) item.append(textNode("p", "Réponses synchronisées."));
        else {
          const open = textNode("button", "Ouvrir");
          open.onclick = () => openOfflineHomework(snapshot.account, task);
          item.append(" ", open);
        }
      } else item.append(textNode("p", "À charger en ligne."));
      list.append(item);
    }
    snapshot.homework.forEach(item => add(item.title, item.dueDate, tasks.find(task => task.title === item.title)));
    tasks.filter(task => !shown.has(task.title)).forEach(task => add(task.title, "", task));
  }

  function openOfflineHomework(account, task) {
    const list = $("offlineHomework");
    list.replaceChildren();
    const container = textNode("li", "");
    const back = textNode("button", "Retour aux devoirs");
    back.onclick = renderOfflineHomework;
    const form = document.createElement("form");
    const answers = task.answers.slice();
    const message = textNode("p", "");
    message.setAttribute("role", "status");
    function save(queued) {
      const tasks = tasksFor(account);
      const index = tasks.findIndex(item => item.submissionId === task.submissionId);
      if (index === -1 || tasks[index].queued || tasks[index].sent) return false;
      tasks[index] = { ...tasks[index], answers, queued };
      return saveTasks(account, tasks);
    }
    container.append(back, textNode("h2", task.title), form, message);
    task.questions.forEach((question, i) => {
      const field = document.createElement("fieldset");
      field.append(textNode("legend", (i + 1) + ". " + question.question));
      question.options.forEach((option, j) => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "radio";
        input.name = "q" + i;
        input.required = true;
        input.checked = answers[i] === j;
        input.onchange = () => {
          answers[i] = j;
          message.textContent = save(false) ? "" : "Impossible d’enregistrer ce brouillon sur cet appareil.";
        };
        label.append(input, " ", option);
        field.append(label);
      });
      form.append(field);
    });
    form.append(textNode("button", "Envoyer à la reconnexion"));
    form.onsubmit = event => {
      event.preventDefault();
      if (!save(true)) { message.textContent = "Impossible d’enregistrer les réponses sur cet appareil."; return; }
      renderOfflineHomework();
      syncOfflineHomework();
    };
    list.append(container);
  }

  function fromPortalFrame(source) {
    const frame = $("app").contentWindow;
    for (let level = 0; source && level < 8; level++) {
      if (source === frame) return true;
      if (source === window) return false;
      try {
        const parent = source.parent;
        if (parent === source) return false;
        source = parent;
      } catch (error) { return false; }
    }
    return false;
  }

  addEventListener("message", event => {
    if (!/^https:\/\/(?:script\.google\.com|[a-z0-9-]+-script\.googleusercontent\.com|script\.googleusercontent\.com)$/.test(event.origin)) return;
    const data = event.data;
    if (!fromPortalFrame(event.source) || !data) return;
    if (data.type === "lwsm-offline-homework" && data.homework === null) {
      portalFrame = null;
      if (syncing) { clearTimeout(syncing.timer); syncing = null; }
      try { localStorage.removeItem(offlineKey); } catch (error) {}
      $("offlineHomework").replaceChildren();
      return;
    }
    if (typeof data.account !== "string" || !/^s[a-z0-9]{8,40}$/i.test(data.account)) return;
    const account = data.account;
    if (data.type === "lwsm-offline-homework" && Array.isArray(data.homework)) {
      const homework = data.homework.slice(0,150).filter(item => item && typeof item.title === "string" && typeof item.dueDate === "string")
        .map(item => ({ title:item.title.slice(0,250), dueDate:item.dueDate.slice(0,60) }));
      try { localStorage.setItem(offlineKey, JSON.stringify({ account, homework })); } catch (error) {}
      portalFrame = { source:event.source, origin:event.origin, account };
      syncOfflineHomework();
    } else if (data.type === "lwsm-offline-lesson" && portalFrame && portalFrame.source === event.source && portalFrame.account === account) {
      if (typeof data.title !== "string" || typeof data.version !== "string" || !Array.isArray(data.questions) || data.questions.length !== 30) return;
      if (!data.questions.every(q => q && typeof q.question === "string" && Array.isArray(q.options) &&
        q.options.length >= 2 && q.options.length <= 4 && q.options.every(option => typeof option === "string"))) return;
      const tasks = tasksFor(account);
      const existing = tasks.find(task => task.title === data.title);
      if (existing && (existing.queued || existing.version === data.version)) return;
      const submissionId = "offline-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
      const questions = data.questions.map(q => ({ question:q.question, options:q.options }));
      saveTasks(account, tasks.filter(task => task !== existing).concat({
        title:data.title, version:data.version, questions, answers:Array(questions.length).fill(null), submissionId
      }));
    } else if (data.type === "lwsm-sync-result" && syncing && syncing.account === account && syncing.id === data.id) {
      clearTimeout(syncing.timer);
      syncing = null;
      const result = data.result;
      if (result && (result.ok || ["QUESTIONS_CHANGED","BAD_ANSWERS","CLOSED","WRONG_PROMOTION","NO_QUESTIONS"].includes(result.code))) {
        const tasks = tasksFor(account).map(task => task.submissionId !== data.id ? task :
          result.ok ? { ...task, queued:false, sent:true } : { ...task, error:result.message || "Le devoir est indisponible. Vos réponses sont conservées." });
        if (saveTasks(account, tasks)) syncOfflineHomework();
      }
    }
    if (!navigator.onLine && $("offlineScreen").style.display === "flex") renderOfflineHomework();
  });

  function start() {
    const f = $("app");
    $("offlineScreen").style.display = navigator.onLine || f.style.display === "block" ? "none" : "flex";
    if (!navigator.onLine) { $("loading").style.display = "none"; renderOfflineHomework(); return; }
    $("loading").style.display = "flex";
    f.onload = () => {
      clearTimeout(slowT);
      $("loading").style.display = "none";
      f.style.display = "block";
    };
    $("slow").style.display = "none";
    const slowT = setTimeout(() => { $("slow").style.display = "block"; }, 12000);
    f.src = DEFAULT_APP_URL;
  }

  // ── Hauteur des bandeaux : l'application s'affiche en dessous ──
  function measureBars() {
    const h = $("bars").offsetHeight;
    const anyBar = ["offline", "updateBar", "installBar"].some(id => $(id).style.display === "flex");
    document.documentElement.style.setProperty("--bar-h", anyBar ? h + "px" : "0px");
    document.documentElement.style.setProperty("--app-pad", anyBar ? "0px" : "env(safe-area-inset-top)");
  }
  function showBar(id, on) { $(id).style.display = on ? "flex" : "none"; measureBars(); }
  if ("ResizeObserver" in window) new ResizeObserver(measureBars).observe($("bars"));

  // ── Hors-ligne ──
  function net() {
    showBar("offline", !navigator.onLine);
    if ($("app").style.display !== "block") start();
  }
  addEventListener("online", () => {
    $("offlineScreen").style.display = "none";
    net();
    syncOfflineHomework();
  });
  addEventListener("offline", net);
  $("browseOffline").onclick = () => {
    $("offlineScreen").style.display = "flex";
    $("loading").style.display = "none";
    renderOfflineHomework();
  };
  $("retryConnection").onclick = start;
  showBar("offline", !navigator.onLine);

  // ── Installation : le bandeau reste tant que l'app n'est pas installée ──
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = /android/i.test(navigator.userAgent);
  let deferred = null;
  if (!standalone) {
    addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; showBar("installBar", true); });
    if (isIOS || isAndroid) showBar("installBar", true);
  }
  addEventListener("appinstalled", () => { deferred = null; showBar("installBar", false); });
  $("installBtn").onclick = async () => {
    if (deferred) {
      const ev = deferred; deferred = null;
      try { ev.prompt(); const r = await ev.userChoice; if (r && r.outcome === "accepted") { showBar("installBar", false); return; } } catch (e) {}
    }
    $("sheetSteps").innerHTML = isIOS
      ? "<li>Touchez le bouton <b>Partager</b> (carré avec une flèche) dans Safari.</li><li>Choisissez <b>Sur l'écran d'accueil</b>.</li><li>Touchez <b>Ajouter</b>.</li>"
      : isAndroid
      ? "<li>Ouvrez cette page dans Chrome à jour.</li><li>Dans le menu <b>⋮</b>, choisissez <b>Installer et créer un raccourci</b> ou <b>Ajouter à l’écran d’accueil</b>.</li><li>Choisissez <b>Installer</b>. Si l’installation est indisponible ou bloquée, choisissez <b>Créer un raccourci</b> si Chrome le propose.</li>"
      : "<li>Ouvrez le menu du navigateur (<b>⋮</b> ou l'icône d'installation dans la barre d'adresse).</li><li>Choisissez <b>Installer l'application</b>.</li><li>Confirmez avec <b>Installer</b>.</li>";
    $("sheet").style.display = "flex";
  };
  $("sheetClose").onclick = () => { $("sheet").style.display = "none"; };

  const LOADED_VERSION = "20261122-2";
  const worker = navigator.serviceWorker;
  const registration = worker ? worker.register("sw.js", { updateViaCache: "none" }).catch(() => null) : Promise.resolve(null);
  let checking = false;
  async function checkVersion() {
    if (checking || !navigator.onLine) return;
    checking = true;
    try {
      const response = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
      if (response.ok) {
        const { version } = await response.json();
        if (version) showBar("updateBar", String(version) !== LOADED_VERSION);
      }
    } catch (error) { /* A later check can retry. */ }
    finally { checking = false; }
  }
  let reloadRequested = false;
  if (worker) worker.addEventListener("controllerchange", () => {
    if (reloadRequested) location.replace(location.pathname + "?u=" + Date.now());
  });
  $("updateBtn").onclick = async () => {
    if (!navigator.onLine || reloadRequested) return;
    reloadRequested = true;
    $("updateBtn").disabled = true;
    const reg = await registration;
    if (reg) {
      try { await reg.update(); } catch (error) {}
      if (reg.waiting) reg.waiting.postMessage("SKIP_WAITING");
    }
    if (!reg || (!reg.installing && !reg.waiting)) location.replace(location.pathname + "?u=" + Date.now());
    else setTimeout(() => {
      reloadRequested = false;
      $("updateBtn").disabled = false;
      checkVersion();
    }, 10000);
  };
  checkVersion();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkVersion(); });
  addEventListener("online", checkVersion);
  setInterval(checkVersion, 5 * 60 * 1000);

  // ── Garde l'écran allumé (utile pour le kiosque) ──
  let wl = null;
  async function keepAwake() { try { if ("wakeLock" in navigator) wl = await navigator.wakeLock.request("screen"); } catch (e) {} }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
  keepAwake();
  start();
</script>
</body>
</html>
